[package]
name = "yaazhi-core"
version = "0.1.0"
edition = "2024"

[dependencies]

# docs - https://docs.rs/tracing/latest/tracing/index.html
tracing = "0.1"

# docs - https://docs.rs/tracing-subscriber/latest/tracing_subscriber/index.html
tracing-subscriber = { version = "0.3", features = ["fmt","chrono" ] }

serde = { version = "1.0", features = ["derive"] }
quick-xml = { version = "0.30", features = ["serialize"] }
sqlx = { version = "0.8", features = [ "runtime-tokio","sqlite","mysql","postgres" ] }